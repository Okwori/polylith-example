name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          cli: latest
          clj-kondo: latest

      - name: Cache deps
        uses: actions/cache@v5.0.4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-deps-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Lint with clj-kondo
        run: clj-kondo --lint bases components

      - name: Check formatting
        run: clojure -M:cljfmt check

      - name: Set up ChromeDriver
        uses: browser-actions/setup-chrome@setup-chrome-v2.1.1

      - name: Run specs
        run: clojure -M:dev:test
