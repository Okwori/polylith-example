name: Deploy — Production

on:
  workflow_run:
    workflows: ["Deploy — Staging"]
    types: [completed]

jobs:
  deploy:
    name: Push & deploy to production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production   # requires manual approval in GitHub env settings

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      APP_PROFILE: prod

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          cli: latest

      - name: Cache deps
        uses: actions/cache@v5.0.4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-deps-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Push to Datomic Cloud
        run: clojure -A:dev:ion push --uname ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to production
        run: |
          clojure -A:dev:ion deploy \
            --system ${{ vars.PROD_SYSTEM }} \
            --uname  ${{ github.event.workflow_run.head_sha }}

      - name: Wait for deploy
        run: |
          clojure -A:dev:ion deploy-status \
            --system ${{ vars.PROD_SYSTEM }} \
            --uname  ${{ github.event.workflow_run.head_sha }}
